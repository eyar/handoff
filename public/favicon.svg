<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3ECF8E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D8CFF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="url(#gradient)"/>
  
  <!-- Transfer arrows representing handoff -->
  <g fill="white">
    <!-- Left arrow (phone to computer) -->
    <path d="M8 12 L4 16 L8 20 L8 17 L12 17 L12 15 L8 15 Z"/>
    
    <!-- Right arrow (computer to phone) -->
    <path d="M24 20 L28 16 L24 12 L24 15 L20 15 L20 17 L24 17 Z"/>
    
    <!-- Center dot representing connection -->
    <circle cx="16" cy="16" r="3"/>
  </g>
</svg>